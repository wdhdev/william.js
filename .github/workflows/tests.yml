name: Tests

on:
    push:
        branches: [main]
        paths:
            - "src/**"
            - "tests/**"
            - ".github/workflows/tests.yml"
            - "package-lock.json"
            - "package.json"

    pull_request_target:

    workflow_dispatch:

jobs:
    package:
        name: Package
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v7.0.1

            - uses: actions/setup-node@v7.0.0
              with:
                  node-version: "24.20.0"
                  registry-url: "https://registry.npmjs.org"

            - run: npm install

            - run: npm test
